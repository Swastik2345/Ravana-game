<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dussehra Game - Ravana Challenge</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(to top, #ffcc99, #ff9966);
    font-family: sans-serif;
  }
  #gameArea {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  #bow {
    position: absolute;
    bottom: 100px;
    left: 50px;
    font-size: 50px;
  }
  .arrow {
    position: absolute;
    width: 60px;
    height: 60px;
    background: url("https://png.pngtree.com/png-clipart/20211217/ourmid/pngtree-beautiful-bow-and-arrow-matting-free-png-transparent-layer-material-png-image_4068591.png") no-repeat center/contain;
    pointer-events: none;
  }
  .head {
    position: absolute;
    width: 70px;
    height: 70px;
    background: url("https://c8.alamy.com/comp/2D599FR/vector-illustration-of-demon-the-ravana-having-horn-and-realistic-face-2D599FR.jpg") no-repeat center/cover;
  }
  #scoreBoard, #timer {
    position: absolute;
    top: 10px;
    font-size: 22px;
    font-weight: bold;
    color: darkred;
  }
  #scoreBoard { left: 20px; }
  #timer { right: 20px; }
  #message {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 32px;
    color: darkred;
    display: none;
    background: #fff8;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
  }
  #controls {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
    z-index: 999;
  }
  .ctrlBtn {
    padding: 12px 18px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    background: darkgreen;
    color: white;
    cursor: pointer;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="gameArea">
    <div id="bow">🏹</div>
    <div id="scoreBoard">Score: 0</div>
    <div id="timer">Time: 60</div>
    <div id="message"></div>

    <div id="controls">
      <button class="ctrlBtn" id="forwardBtn">⬆ Forward</button>
      <button class="ctrlBtn" id="rightBtn">➡ Right</button>
    </div>

    <canvas id="fireworks"></canvas>
  </div>

<script>
const gameArea = document.getElementById("gameArea");
const bow = document.getElementById("bow");
const scoreBoard = document.getElementById("scoreBoard");
const timerDisplay = document.getElementById("timer");
const message = document.getElementById("message");
const fireworksCanvas = document.getElementById("fireworks");
const ctx = fireworksCanvas.getContext("2d");
fireworksCanvas.width = window.innerWidth;
fireworksCanvas.height = window.innerHeight;

let score = 0;
let arrows = [];
let heads = [];
let timeLeft = 60;
let gameOver = false;
let shooting = false;
let shootDirection = null;

// Ask player name
let playerName = prompt("Enter your name:") || "Player";

// Spawn Ravana heads every 0.5s
setInterval(() => {
  if (gameOver) return;
  let head = document.createElement("div");
  head.classList.add("head");
  head.style.left = Math.random() * (window.innerWidth - 70) + "px";
  head.style.top = Math.random() * (window.innerHeight - 200) + "px";
  gameArea.appendChild(head);

  let vx = (Math.random() * 4 - 2);
  let vy = (Math.random() * 4 - 2);
  heads.push({el: head, x: parseInt(head.style.left), y: parseInt(head.style.top), vx, vy});
}, 500);

// Timer countdown
let timerInterval = setInterval(() => {
  if (gameOver) return;
  timeLeft--;
  timerDisplay.textContent = `Time: ${timeLeft}`;
  if (timeLeft <= 0) {
    endGame();
  }
}, 1000);

// 🎯 Shoot arrow function
function shoot(direction) {
  if (gameOver) return;

  let vx = 0, vy = 0, angle = 0;

  if (direction === "forward") { vx = 0; vy = -10; angle = -Math.PI/2; }
  if (direction === "right") { vx = 10; vy = 0; angle = 0; }

  let arrow = document.createElement("div");
  arrow.classList.add("arrow");
  arrow.style.left = bow.offsetLeft + 40 + "px";
  arrow.style.top = bow.offsetTop + "px";
  arrow.style.transform = `rotate(${angle}rad)`;
  gameArea.appendChild(arrow);

  arrows.push({el: arrow, x: bow.offsetLeft+40, y: bow.offsetTop, vx, vy});
}

// Continuous shooting logic
function startShooting(direction) {
  if (gameOver) return;
  shooting = true;
  shootDirection = direction;
  shoot(direction);
  shootInterval = setInterval(() => {
    if (shooting) shoot(direction);
  }, 200); // shoot every 0.2 seconds
}

function stopShooting() {
  shooting = false;
  clearInterval(shootInterval);
}

function moveArrows() {
  if (gameOver) return;
  arrows.forEach((arrow, index) => {
    arrow.x += arrow.vx;
    arrow.y += arrow.vy;
    arrow.el.style.left = arrow.x + "px";
    arrow.el.style.top = arrow.y + "px";

    heads.forEach((head, hIndex) => {
      if (!head) return;
      let headRect = head.el.getBoundingClientRect();
      let arrRect = arrow.el.getBoundingClientRect();

      if (!(arrRect.right < headRect.left || arrRect.left > headRect.right || arrRect.bottom < headRect.top || arrRect.top > headRect.bottom)) {
        score += 10;
        scoreBoard.textContent = `Score: ${score}`;
        gameArea.removeChild(head.el);
        heads[hIndex] = null;

        if (arrow.el.parentNode) gameArea.removeChild(arrow.el);
        arrows[index] = null;
      }
    });

    if (arrow && (arrow.x < 0 || arrow.y < 0 || arrow.x > window.innerWidth || arrow.y > window.innerHeight)) {
      if (arrow.el.parentNode) gameArea.removeChild(arrow.el);
      arrows[index] = null;
    }
  });
  arrows = arrows.filter(a => a !== null);
  requestAnimationFrame(moveArrows);
}

function moveHeads() {
  if (gameOver) return;
  heads.forEach((head) => {
    if (!head) return;
    head.x += head.vx;
    head.y += head.vy;

    if (head.x <= 0 || head.x >= window.innerWidth - 70) head.vx *= -1;
    if (head.y <= 0 || head.y >= window.innerHeight - 70) head.vy *= -1;

    head.el.style.left = head.x + "px";
    head.el.style.top = head.y + "px";
  });
  requestAnimationFrame(moveHeads);
}

function endGame() {
  gameOver = true;
  clearInterval(timerInterval);
  message.style.display = "block";
  if (score > 0) {
    message.innerHTML = `🎉 Victory, ${playerName}! 🎉<br>
                         You destroyed Ravana heads!<br>
                         Final Score: ${score}`;
    launchFireworks();
  } else {
    message.innerHTML = `⏳ Time’s up, ${playerName}! ⏳<br>
                         Ravana escaped...<br>
                         Final Score: ${score}`;
  }
}

// 🎆 Fireworks effect
let particles = [];
function launchFireworks() {
  for (let i = 0; i < 50; i++) {
    particles.push({
      x: window.innerWidth/2,
      y: window.innerHeight/2,
      vx: (Math.random()-0.5)*6,
      vy: (Math.random()-0.5)*6,
      life: 100
    });
  }
  animateFireworks();
}
function animateFireworks() {
  ctx.clearRect(0,0,fireworksCanvas.width, fireworksCanvas.height);
  particles.forEach((p)=>{
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    ctx.fillStyle = `rgba(255,${Math.random()*255},0,${p.life/100})`;
    ctx.beginPath();
    ctx.arc(p.x,p.y,4,0,2*Math.PI);
    ctx.fill();
  });
  particles = particles.filter(p=>p.life>0);
  if (particles.length>0) requestAnimationFrame(animateFireworks);
}

// Add hold events for shooting
document.getElementById("forwardBtn").addEventListener("mousedown", () => startShooting("forward"));
document.getElementById("forwardBtn").addEventListener("mouseup", stopShooting);
document.getElementById("forwardBtn").addEventListener("mouseleave", stopShooting);

document.getElementById("rightBtn").addEventListener("mousedown", () => startShooting("right"));
document.getElementById("rightBtn").addEventListener("mouseup", stopShooting);
document.getElementById("rightBtn").addEventListener("mouseleave", stopShooting);

moveArrows();
moveHeads();
</script>
</body>
  </html>
